            - text: The tutorial's
            - code [ref=f6e207]: pod/demo created
            - text: "message is deceptively simple — five components coordinated to make that pod real:"
          - paragraph [ref=f6e209]:
            - text: "Read it top to bottom as:"
            - strong [ref=f6e210]: declare intent → persist → react
            - text: . Nobody "runs your pod" at create time — the API server just records the
            - emphasis [ref=f6e211]: desired
            - text: state, and downstream loops reconcile reality toward it.
          - heading [level=2] [ref=f6e212]:
            - text: The core idea — desired state + control loops
            - link "¶" [ref=f6e213] [cursor=pointer]:
              - /url: "#the-core-idea-desired-state-control-loops"
          - paragraph [ref=f6e214]: "This is the one concept everything else hangs on:"
          - list [ref=f6e215]:
            - listitem [ref=f6e216]:
              - strong [ref=f6e217]: You declare desired state
              - text: — "2 nginx replicas", "a Secret named
              - code [ref=f6e218]: postgres
              - text: "\", written to etcd via the API server."
            - listitem [ref=f6e219]:
              - strong [ref=f6e220]: Controllers loop forever
              - text: "— watch → compare desired vs actual → act to close the gap. That's why deleting a pod under a Deployment gets a fresh one for free: the ReplicaSet controller sees"
              - code [ref=f6e221]: desired=1, actual=0
              - text: and creates a replacement.
            - listitem [ref=f6e222]:
              - strong [ref=f6e223]: Nothing calls kubectl but you
              - text: — the cluster manages itself through the API.
              - code [ref=f6e224]: kubectl
              - text: is just one client of many (scheduler, kubelet, controllers all speak to the same API server).
