            - rowgroup [ref=f6e143]:
              - row [ref=f6e144]:
                - cell [ref=f6e145]:
                  - strong [ref=f6e146]: API server
                - cell "Control plane" [ref=f6e147]
                - cell [ref=f6e148]:
                  - text: The
                  - emphasis [ref=f6e149]: only
                  - text: front door — every kubectl command, every internal component talks to it. Validates and persists objects.
                - cell [ref=f6e150]:
                  - code [ref=f6e151]: kubectl
                  - text: commands target it;
                  - code [ref=f6e152]: localhost:8080
                  - text: error = can't reach it
              - row [ref=f6e153]:
                - cell [ref=f6e154]:
                  - strong [ref=f6e155]: etcd
                - cell "Control plane" [ref=f6e156]
                - cell "Distributed key-value store holding the entire cluster state (desired + observed). If it's lost, the cluster has amnesia." [ref=f6e157]
                - cell [ref=f6e158]:
                  - text: It's why
                  - code [ref=f6e159]: get-contexts
                  - text: /
                  - code [ref=f6e160]: use-context
                  - text: matters — contexts point at
                  - emphasis [ref=f6e161]: which
                  - text: etcd-backed API you're mutating
              - row [ref=f6e162]:
                - cell [ref=f6e163]:
                  - strong [ref=f6e164]: Scheduler
                - cell "Control plane" [ref=f6e165]
                - cell [ref=f6e166]:
                  - text: Watches for pods with no
                  - code [ref=f6e167]: nodeName
                  - text: ", scores nodes, binds the pod to the best fit."
                - cell [ref=f6e168]:
                  - code [ref=f6e169]: pod.spec.containers
                  - text: field from
                  - code [ref=f6e170]: kubectl explain
                  - text: — the scheduler fills in
                  - code [ref=f6e171]: nodeName
                  - text: ", not you"
              - row [ref=f6e172]:
                - cell [ref=f6e173]:
                  - strong [ref=f6e174]: Controller manager
                - cell "Control plane" [ref=f6e175]
                - cell "Bundles the control loops (Deployment, StatefulSet, Job, ReplicaSet controllers…). Each watches the API, compares desired vs actual, acts." [ref=f6e176]
                - cell [ref=f6e177]:
                  - code [ref=f6e178]: kubectl run
                  - text: → something else created the pod; a
                  - emphasis [ref=f6e179]: controller
                  - text: did the work
              - row [ref=f6e180]:
                - cell [ref=f6e181]:
                  - strong [ref=f6e182]: kubelet
                - cell "Every node" [ref=f6e183]
                - cell [ref=f6e184]:
                  - text: Agent on each node. Watches the API for pods assigned to
                  - emphasis [ref=f6e185]: its
                  - text: node, drives the runtime to start them, reports status back.
                - cell [ref=f6e186]:
                  - code [ref=f6e187]: STATUS
                  - text: column in
                  - code [ref=f6e188]: get pods -w
                  - text: — kubelet reporting up
              - row [ref=f6e189]:
                - cell [ref=f6e190]:
                  - strong [ref=f6e191]: Container runtime
                - cell "Every node" [ref=f6e192]
                - cell "Actually pulls images and runs containers." [ref=f6e193]
                - cell [ref=f6e194]:
                  - code [ref=f6e195]: containerd
                  - text: — the Rancher Desktop caveat in step 2.2
              - row [ref=f6e196]:
