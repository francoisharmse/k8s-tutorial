              - text: shows
              - code [ref=f6e230]: control-plane,master
              - text: in its
              - code [ref=f6e231]: ROLES
              - text: column yet also runs your pods. In a production cluster these would be 3+ separate machines, and you'd point
              - code [ref=f6e232]: get-contexts
              - text: at a remote API server instead of
              - code [ref=f6e233]: 127.0.0.1
