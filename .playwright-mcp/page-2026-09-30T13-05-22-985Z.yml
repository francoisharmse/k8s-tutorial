          - paragraph [ref=f6e123]:
            - text: What's actually inside the cluster you connected to in step
            - link "0.2" [ref=f6e124] [cursor=pointer]:
              - /url: ../../steps/phase-0/#02-verify-cluster-access
            - text: . This is the
            - emphasis [ref=f6e125]: design
            - text: "layer below the three-tier app: who stores the state, who makes decisions, and who does the work."
          - heading [level=2] [ref=f6e126]:
            - text: The two halves — control plane and nodes
            - link "¶" [ref=f6e127] [cursor=pointer]:
              - /url: "#the-two-halves-control-plane-and-nodes"
          - paragraph [ref=f6e128]:
            - text: Kubernetes splits every cluster into a
            - strong [ref=f6e129]: control plane
            - text: (the brain — stores state and makes decisions) and
            - strong [ref=f6e130]: worker nodes
            - text: (the muscle — run your pods). On Rancher Desktop both live on one machine, but the separation still exists logically.
          - heading [level=2] [ref=f6e132]:
            - text: The components, one line each
            - link "¶" [ref=f6e133] [cursor=pointer]:
              - /url: "#the-components-one-line-each"
