apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: k8s-tutorial
    tier: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-tutorial
      tier: app
  template:
    metadata:
      labels:
        app: k8s-tutorial
        tier: app
    spec:
      containers:
        - name: app
          image: k8s-tutorial-app:0.1.0   # the tag built in step 2.2
          imagePullPolicy: IfNotPresent   # use the node-local image
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:               # every key in app-config → env var
                name: app-config
          env:
            - name: DB_PASSWORD           # the one value from the Secret
              valueFrom:
                secretKeyRef:
                  name: postgres-creds    # created in step 1.1
                  key: app-password
          readinessProbe:                 # gates Service endpoints (2.5)
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
          livenessProbe:                  # restarts a hung container (2.5)
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
          resources:                      # QoS class Burstable (2.6)
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
